name: guardian_plus_app
description: "Guardian+ mobile app: Care Circle members follow and respond to the alerts of the person under their care."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.6.0
  get_it: ^9.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Brand typefaces (report, section 3.1.1.1 C)
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/inter_400.ttf
          weight: 400
        - asset: assets/fonts/inter_500.ttf
          weight: 500
        - asset: assets/fonts/inter_600.ttf
          weight: 600
        - asset: assets/fonts/inter_700.ttf
          weight: 700
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/plus_jakarta_sans_500.ttf
          weight: 500
        - asset: assets/fonts/plus_jakarta_sans_600.ttf
          weight: 600
        - asset: assets/fonts/plus_jakarta_sans_700.ttf
          weight: 700
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/jetbrains_mono_400.ttf
          weight: 400
        - asset: assets/fonts/jetbrains_mono_500.ttf
          weight: 500
        - asset: assets/fonts/jetbrains_mono_700.ttf
          weight: 700
